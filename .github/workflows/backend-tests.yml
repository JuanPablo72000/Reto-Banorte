name: backend-tests

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore backend/BancaAdaptativa.slnx
      - run: dotnet build backend/BancaAdaptativa.slnx --no-restore -c Release
      - run: dotnet test backend/BancaAdaptativa.slnx --no-build -c Release --collect:"XPlat Code Coverage" --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/**

  mutation:
    runs-on: ubuntu-latest
    needs: test
    # Solo reporta: no bloquea el merge mientras se estabiliza el umbral
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet tool install dotnet-stryker --version 5.0.0
      - run: dotnet stryker --config-file stryker-config.json
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: backend/StrykerOutput/**/mutation-report.html
