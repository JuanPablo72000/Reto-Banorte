version: 1
contract: "A2UI-MCP"
project: "Banca Personal Adaptativa"

owners:
  backend: "Pablo"
  mcp: "Guillermo"
  integration: "Cain"
  frontend: "Juan Pablo"

apiBaseUrl: "http://localhost:8000"
openApiPath: "contracts/openapi/openapi.yaml"

principle: |
  La IA de Guillermo genera componentes A2UI usando placeholders.
  La IA no debe incluir datos reales sensibles dentro del JSON A2UI.
  La IA solo indica qué dato se necesita mediante un dataRef.
  El frontend resuelve ese dataRef llamando a la API de Pablo.

rules:
  - "La IA solo puede usar dataRefs definidos en este archivo."
  - "La IA no debe inventar endpoints."
  - "La IA no debe incluir saldos reales."
  - "La IA no debe incluir números completos de cuenta."
  - "La IA no debe incluir datos personales sensibles."
  - "Todo dato dinámico debe usar un objeto con dataRef."
  - "Todo dato dinámico debe declarar loading, error y fallback."
  - "Las fechas e instantes vienen en UTC desde la API."
  - "El frontend convierte fechas UTC a visualización local si hace falta."
  - "Las acciones mutantes requieren confirmación explícita del usuario."
  - "Las acciones deben usar operationId existente en OpenAPI."
  - "La IA puede generar textos estáticos como títulos, etiquetas o avisos."

stateKeys:
  - selectedAccountId
  - currentTransferId
  - selectedDateRange
  - selectedStatementId
  - selectedCardId

formats:
  currency:
    description: "Valor monetario."
    example: 15230.50
    uiExample: "$15,230.50"
    requiresCurrencyField: true

  date:
    description: "Fecha calendario sin hora."
    example: "2026-06-16"

  datetimeUtc:
    description: "Instante en UTC."
    example: "2026-06-16T18:00:00Z"

  list:
    description: "Lista de elementos."
    example: []

  object:
    description: "Objeto completo."
    example: {}

dataRefs:

  server.time:
    description: "Hora actual del servidor en UTC."
    operationId: getServerTime
    method: GET
    path: "/server-time"
    selector: serverTimeUtc
    format: datetimeUtc
    sensitivity: low
    uiHints:
      - Text
      - Timestamp

  me.preferences:
    description: "Preferencias de accesibilidad del usuario."
    operationId: getMePreferences
    method: GET
    path: "/me/preferences"
    selector: "$"
    format: object
    sensitivity: medium
    uiHints:
      - AccessibilityPanel

  accounts.list:
    description: "Lista de cuentas del usuario con filtros opcionales."
    operationId: getAccounts
    method: GET
    path: "/accounts"
    selector: "$"
    format: list
    sensitivity: medium
    queryParams:
      status:
        type: string
        description: "Filtro por estado: active, blocked, etc."
      accountType:
        type: string
        description: "Filtro por tipo: debito, credito."
    uiHints:
      - AccountList
      - SelectAccount

  accounts.summary.totalBalance:
    description: "Saldo total de las cuentas del usuario."
    operationId: getMeAccountSummary
    method: GET
    path: "/me/account-summary"
    selector: totalBalance
    currencySelector: currency
    format: currency
    sensitivity: high
    uiHints:
      - StatLabel
      - StatCard

  account.detail:
    description: "Detalle de una cuenta específica."
    operationId: getAccountById
    method: GET
    path: "/accounts/{accountId}"
    selector: "$"
    format: object
    sensitivity: medium
    params:
      accountId:
        type: integer
        required: true
        source: state.selectedAccountId
    uiHints:
      - AccountDetail

  transactions.list:
    description: "Movimientos de una cuenta con filtros por fecha, categoría, dirección y búsqueda."
    operationId: getAccountTransactions
    method: GET
    path: "/accounts/{accountId}/transactions"
    selector: "$"
    format: list
    sensitivity: medium
    params:
      accountId:
        type: integer
        required: true
        source: state.selectedAccountId
    queryParams:
      from:
        type: date
        description: "Fecha inicio (yyyy-MM-dd)."
        source: state.selectedDateRange.from
      to:
        type: date
        description: "Fecha fin (yyyy-MM-dd)."
        source: state.selectedDateRange.to
      category:
        type: string
        description: "Categoría libre heredada (super, nomina, etc.)."
      expenseCategory:
        type: string
        description: "Código del catálogo ExpenseCategory (supermarket, gas, etc.)."
      direction:
        type: string
        description: "credit | debit."
      status:
        type: string
        description: "posted | pending."
      search:
        type: string
        description: "Texto a buscar en descripción o referencia."
      limit:
        type: integer
        description: "Máximo de resultados (1-100, default 50)."
    uiHints:
      - TransactionList

  transactions.global:
    description: "Búsqueda transversal de movimientos en todas las cuentas del usuario."
    operationId: getAllTransactions
    method: GET
    path: "/me/transactions"
    selector: "$"
    format: list
    sensitivity: medium
    queryParams:
      accountId:
        type: integer
        description: "Opcional: acotar a una cuenta."
      from:
        type: date
      to:
        type: date
      expenseCategory:
        type: string
      direction:
        type: string
      status:
        type: string
      search:
        type: string
      limit:
        type: integer
    uiHints:
      - TransactionList

  dailyBalances.list:
    description: "Balances diarios de una cuenta acotados por rango de fechas."
    operationId: getAccountDailyBalances
    method: GET
    path: "/accounts/{accountId}/daily-balances"
    selector: "$"
    format: list
    sensitivity: medium
    params:
      accountId:
        type: integer
        required: true
        source: state.selectedAccountId
    queryParams:
      from:
        type: date
        source: state.selectedDateRange.from
      to:
        type: date
        source: state.selectedDateRange.to
    uiHints:
      - DailyBalanceChart

  transfers.list:
    description: "Historial de transferencias del usuario con filtros por estado, cuenta origen y fecha."
    operationId: getTransfers
    method: GET
    path: "/transfers"
    selector: "$"
    format: list
    sensitivity: high
    queryParams:
      status:
        type: string
        description: "pending | confirmed."
      originAccountId:
        type: integer
        description: "Filtrar por cuenta origen."
      from:
        type: datetimeUtc
      to:
        type: datetimeUtc
      limit:
        type: integer
    uiHints:
      - TransferList

  transfer.detail:
    description: "Detalle de una transferencia."
    operationId: getTransferById
    method: GET
    path: "/transfers/{transferId}"
    selector: "$"
    format: object
    sensitivity: high
    params:
      transferId:
        type: integer
        required: true
        source: state.currentTransferId
    uiHints:
      - TransferSummary

  reconciliation.list:
    description: "Lista de conciliaciones con filtro opcional por estado."
    operationId: getReconciliation
    method: GET
    path: "/reconciliation"
    selector: "$"
    format: list
    sensitivity: medium
    queryParams:
      status:
        type: string
        description: "pending | matched."
    uiHints:
      - ReconciliationTable

  statements.list:
    description: "Estados de cuenta mensuales pre-computados de una cuenta, por año, mes y estado."
    operationId: getAccountStatements
    method: GET
    path: "/accounts/{accountId}/statements"
    selector: "$"
    format: list
    sensitivity: medium
    params:
      accountId:
        type: integer
        required: true
        source: state.selectedAccountId
    queryParams:
      year:
        type: integer
      month:
        type: integer
      status:
        type: string
        description: "generated | archived."
    uiHints:
      - StatementList
      - StatementSummary

  statements.expenses:
    description: "Detalle de un estado de cuenta con desglose de gastos por categoría."
    operationId: getAccountStatementDetail
    method: GET
    path: "/accounts/{accountId}/statements/{statementId}"
    selector: "$"
    format: object
    sensitivity: medium
    params:
      accountId:
        type: integer
        required: true
        source: state.selectedAccountId
      statementId:
        type: integer
        required: true
        source: state.selectedStatementId
    uiHints:
      - StatementSummary
      - ExpenseBreakdownChart

  expenseCategories.list:
    description: "Catálogo de clasificaciones de gasto con búsqueda por nombre o código."
    operationId: getExpenseCategories
    method: GET
    path: "/expense-categories"
    selector: "$"
    format: list
    sensitivity: low
    queryParams:
      search:
        type: string
        description: "Búsqueda parcial en nombre o código."
    uiHints:
      - CategoryList

  budgets.monthly:
    description: "Resumen de presupuestos por categoría del mes con filtros opcionales."
    operationId: getMonthlyBudgets
    method: GET
    path: "/me/budgets/monthly"
    selector: "$"
    format: object
    sensitivity: medium
    queryParams:
      year:
        type: integer
        required: true
      month:
        type: integer
        required: true
      category:
        type: string
        description: "Código de categoría (supermarket, gas, etc.)."
      status:
        type: string
        description: "active | exceeded."
    uiHints:
      - BudgetProgressCard

  savingsGoals.list:
    description: "Metas de ahorro del usuario con su progreso y filtro por estado."
    operationId: getSavingsGoals
    method: GET
    path: "/me/savings-goals"
    selector: "$"
    format: list
    sensitivity: medium
    queryParams:
      status:
        type: string
        description: "active | paused | completed."
    uiHints:
      - SavingsGoalCard

  creditCards.list:
    description: "Tarjetas de crédito del usuario con filtro opcional por estado."
    operationId: getCreditCards
    method: GET
    path: "/me/credit-cards"
    selector: "$"
    format: list
    sensitivity: high
    queryParams:
      status:
        type: string
        description: "active | blocked."
    uiHints:
      - CreditCardSummary

  creditCard.statements:
    description: "Estados de cuenta de una tarjeta de crédito (interés, pago mínimo, vencimiento) con filtros por año y mes."
    operationId: getCreditCardStatements
    method: GET
    path: "/me/credit-cards/{cardId}/statements"
    selector: "$"
    format: list
    sensitivity: high
    params:
      cardId:
        type: integer
        required: true
        source: state.selectedCardId
    queryParams:
      year:
        type: integer
      month:
        type: integer
    uiHints:
      - CreditCardSummary
      - StatementSummary

actions:

  confirmTransfer:
    description: "Confirma una transferencia pendiente."
    operationId: confirmTransfer
    method: POST
    path: "/transfers/{transferId}/confirm"
    requiresConfirmation: true
    idempotencyRequired: true
    sensitivity: high
    params:
      transferId:
        type: integer
        required: true
        source: state.currentTransferId
    successMessage: "Transferencia confirmada correctamente."
    errorMessage: "No se pudo confirmar la transferencia."

components:

  StatLabel:
    description: "Etiqueta para mostrar un valor único, por ejemplo saldo total."
    requiredProps:
      - title
      - value
    valueMustBeDataRef: true
    exampleDataRef: accounts.summary.totalBalance

  StatCard:
    description: "Tarjeta para mostrar un valor destacado."
    requiredProps:
      - title
      - value
    valueMustBeDataRef: true
    exampleDataRef: accounts.summary.totalBalance

  AccountList:
    description: "Lista cuentas del usuario."
    requiredProps:
      - items
    itemsMustBeDataRef: true
    exampleDataRef: accounts.list

  TransactionList:
    description: "Lista movimientos de una cuenta."
    requiredProps:
      - items
    itemsMustBeDataRef: true
    exampleDataRef: transactions.list

  DailyBalanceChart:
    description: "Gráfica de balance diario."
    requiredProps:
      - items
    itemsMustBeDataRef: true
    exampleDataRef: dailyBalances.list

  TransferSummary:
    description: "Resumen de una transferencia."
    requiredProps:
      - data
    dataMustBeDataRef: true
    exampleDataRef: transfer.detail

  ReconciliationTable:
    description: "Tabla de conciliación."
    requiredProps:
      - items
    itemsMustBeDataRef: true
    exampleDataRef: reconciliation.list

  StatementList:
    description: "Lista de estados de cuenta mensuales."
    requiredProps:
      - items
    itemsMustBeDataRef: true
    exampleDataRef: statements.list

  StatementSummary:
    description: "Resumen de un estado de cuenta con totales y periodo de corte."
    requiredProps:
      - data
    dataMustBeDataRef: true
    exampleDataRef: statements.expenses

  ExpenseBreakdownChart:
    description: "Gráfica del desglose de gastos por categoría."
    requiredProps:
      - items
    itemsMustBeDataRef: true
    exampleDataRef: statements.expenses

  CategoryList:
    description: "Catálogo de clasificaciones de gasto."
    requiredProps:
      - items
    itemsMustBeDataRef: true
    exampleDataRef: expenseCategories.list

  BudgetProgressCard:
    description: "Tarjeta de progreso de presupuestos por categoría del mes."
    requiredProps:
      - data
    dataMustBeDataRef: true
    exampleDataRef: budgets.monthly

  SavingsGoalCard:
    description: "Tarjeta de meta de ahorro con su progreso."
    requiredProps:
      - items
    itemsMustBeDataRef: true
    exampleDataRef: savingsGoals.list

  CreditCardSummary:
    description: "Resumen de tarjeta de crédito y sus estados de cuenta."
    requiredProps:
      - items
    itemsMustBeDataRef: true
    exampleDataRef: creditCards.list

examples:

  - id: total-balance
    intent: "Mostrar cantidad total de la cuenta"
    description: |
      Si el usuario pregunta cuánto tiene en la cuenta,
      la IA debe generar un componente StatLabel con dataRef
      accounts.summary.totalBalance.
    a2uiJson: |
      {
        "version": "1.0",
        "viewId": "account-total-balance",
        "components": [
          {
            "componentId": "total-balance-label",
            "type": "StatLabel",
            "title": "Cantidad total de la cuenta",
            "value": {
              "dataRef": "accounts.summary.totalBalance",
              "format": "currency",
              "loading": {
                "type": "skeleton"
              },
              "error": {
                "type": "text",
                "value": "No se pudo cargar el saldo"
              },
              "fallback": {
                "type": "text",
                "value": "--"
              }
            },
            "a11y": {
              "ariaLabel": "Cantidad total de la cuenta"
            }
          }
        ]
      }

  - id: account-list
    intent: "Mostrar cuentas del usuario"
    a2uiJson: |
      {
        "version": "1.0",
        "viewId": "account-list",
        "components": [
          {
            "componentId": "account-list",
            "type": "AccountList",
            "title": "Tus cuentas",
            "items": {
              "dataRef": "accounts.list",
              "format": "list",
              "loading": {
                "type": "skeleton"
              },
              "error": {
                "type": "text",
                "value": "No se pudieron cargar las cuentas"
              },
              "empty": {
                "type": "text",
                "value": "No tienes cuentas disponibles"
              }
            }
          }
        ]
      }

  - id: transaction-list
    intent: "Mostrar movimientos de una cuenta"
    a2uiJson: |
      {
        "version": "1.0",
        "viewId": "transaction-list",
        "components": [
          {
            "componentId": "transaction-list",
            "type": "TransactionList",
            "title": "Movimientos",
            "items": {
              "dataRef": "transactions.list",
              "params": {
                "accountId": {
                  "$state": "selectedAccountId"
                }
              },
              "format": "list",
              "loading": {
                "type": "skeleton"
              },
              "error": {
                "type": "text",
                "value": "No se pudieron cargar los movimientos"
              },
              "empty": {
                "type": "text",
                "value": "Esta cuenta no tiene movimientos"
              }
            }
          }
        ]
      }

validation:
  rejectIf:
    - "El JSON A2UI usa un dataRef que no existe en dataRefs."
    - "El JSON A2UI contiene un saldo real."
    - "El JSON A2UI contiene un número completo de cuenta."
    - "El JSON A2UI contiene datos personales sensibles."
    - "Una acción mutante no requiere confirmación."
    - "Un dato dinámico no tiene loading, error o fallback."

notesForMcp: |
  Guillermo:
  Tu MCP debe cargar este archivo como catálogo permitido.
  La IA puede usar este contrato para:
    1. Saber qué dataRefs existen.
    2. Saber qué componentes puede generar.
    3. Saber qué acciones puede declarar.
    4. Validar el JSON A2UI antes de devolverlo.
  La IA no debe llamar directamente a la API para obtener datos reales
  cuando solo está generando la interfaz.