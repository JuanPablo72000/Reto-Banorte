services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # SQLite persistido en el volumen sqlite-data.
      ConnectionStrings__Default: "Data Source=/data/app.db"
      # Secreto de firma JWT (mín. 32 chars). Definir en .env (ver .env.example).
      JWT_KEY: ${JWT_KEY:?Define JWT_KEY en tu archivo .env}
    volumes:
      - sqlite-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp:
    build:
      context: ./mcp
    env_file:
      - .env
    environment:
      BANORTE_API_BASE_URL: http://api:8000
      MCP_TRANSPORT: http
      MCP_PORT: 8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BANORTE_API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlite-data:
